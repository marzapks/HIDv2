const ThreeDSoundWindow = ({ enabled, setEnabled, mode, setMode, points, setPoints, selectedPoint, setSelectedPoint, onDice }) => {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);

  // Background visual
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const draw = () => {
      const w = canvas.width = canvas.clientWidth * 2;
      const h = canvas.height = canvas.clientHeight * 2;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = 'rgba(0,255,208,0.4)';
      ctx.lineWidth = 1;
      if (mode === 'stage') {
        // stage with speakers
        ctx.strokeRect(w*0.15, h*0.65, w*0.7, h*0.25);
        // speakers
        ctx.strokeRect(w*0.05, h*0.5, w*0.1, h*0.35);
        ctx.strokeRect(w*0.85, h*0.5, w*0.1, h*0.35);
        ctx.beginPath();
        ctx.arc(w*0.5, h*0.78, w*0.05, 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,255,208,0.5)';
        ctx.font = '24px monospace';
        ctx.fillText('STAGE', w*0.42, h*0.95);
      } else if (mode === 'head') {
        // head silhouette
        ctx.beginPath();
        ctx.ellipse(w/2, h/2, w*0.18, h*0.28, 0, 0, Math.PI*2);
        ctx.stroke();
        // ears
        ctx.beginPath();
        ctx.ellipse(w*0.32, h/2, w*0.03, h*0.06, 0, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(w*0.68, h/2, w*0.03, h*0.06, 0, 0, Math.PI*2);
        ctx.stroke();
        // nose direction
        ctx.beginPath(); ctx.moveTo(w/2, h*0.22); ctx.lineTo(w/2-8, h*0.27); ctx.lineTo(w/2+8, h*0.27); ctx.closePath(); ctx.stroke();
      } else {
        // grid
        for (let i = 0; i <= 10; i++) {
          ctx.beginPath(); ctx.moveTo((i/10)*w, 0); ctx.lineTo((i/10)*w, h); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, (i/10)*h); ctx.lineTo(w, (i/10)*h); ctx.stroke();
        }
        // center crosshair
        ctx.strokeStyle = 'rgba(0,255,208,0.8)';
        ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
      }
    };
    draw();
    const obs = new ResizeObserver(draw);
    obs.observe(canvas);
    return () => obs.disconnect();
  }, [mode]);

  const dragPoint = (idx) => (e) => {
    e.preventDefault(); e.stopPropagation();
    setSelectedPoint(idx);
    const t = e.touches ? e.touches[0] : e;
    const startX = t.clientX, startY = t.clientY;
    const ox = points[idx].x, oy = points[idx].y;
    const rect = wrapRef.current.getBoundingClientRect();
    const move = (ev) => {
      const m = ev.touches ? ev.touches[0] : ev;
      const nx = Math.max(0, Math.min(1, ox + (m.clientX - startX)/rect.width));
      const ny = Math.max(0, Math.min(1, oy + (m.clientY - startY)/rect.height));
      const np = points.slice();
      np[idx] = { ...np[idx], x:nx, y:ny };
      setPoints(np);
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', up);
  };

  const makePoint = (flavor, isCenter=false) => {
    const presets = {
      'Shimmer':   {shimmer:.46, space:.68, delay:.30, feedback:.18, glitter:.34, air:.66, mix:.42, z:.52},
      'Aurora':    {shimmer:.34, space:.82, delay:.38, feedback:.22, glitter:.24, air:.58, mix:.38, z:.68},
      'Cosmic':    {shimmer:.42, space:.78, delay:.48, feedback:.25, glitter:.30, air:.55, mix:.40, z:.74},
      'Halo':      {shimmer:.26, space:.72, delay:.22, feedback:.14, glitter:.16, air:.74, mix:.32, z:.46},
      'Glitter':   {shimmer:.48, space:.56, delay:.18, feedback:.15, glitter:.52, air:.80, mix:.34, z:.38},
      'Sub Sky':   {shimmer:.12, space:.80, delay:.45, feedback:.24, glitter:.10, air:.34, mix:.36, z:.86},
      'Dream Echo':{shimmer:.32, space:.74, delay:.58, feedback:.27, glitter:.22, air:.54, mix:.38, z:.62},
      'Vapor':     {shimmer:.28, space:.86, delay:.36, feedback:.20, glitter:.24, air:.70, mix:.34, z:.64},
      'Crystal':   {shimmer:.52, space:.58, delay:.22, feedback:.16, glitter:.46, air:.84, mix:.36, z:.42},
      'Phantom':   {shimmer:.22, space:.84, delay:.50, feedback:.25, glitter:.14, air:.48, mix:.32, z:.78},
      'Air Bell':  {shimmer:.55, space:.55, delay:.16, feedback:.12, glitter:.42, air:.88, mix:.32, z:.34},
      'Tape Choir':{shimmer:.24, space:.70, delay:.42, feedback:.23, glitter:.12, air:.44, mix:.34, z:.56},
      'Center Shimmer':{shimmer:.38, space:.74, delay:.32, feedback:.18, glitter:.28, air:.64, mix:.36, z:.54},
    };
    const base = presets[flavor] || presets.Shimmer;
    return { x:0.18 + Math.random()*0.64, y:0.18 + Math.random()*0.64, flavor, isCenter, ...base };
  };
  const addPoint = () => {
    const flavors = ['Shimmer','Aurora','Cosmic','Halo','Glitter','Sub Sky','Dream Echo','Vapor','Crystal','Phantom','Air Bell','Tape Choir'];
    const fl = flavors[Math.floor(Math.random()*flavors.length)];

  const removePoint = () => {
    if (points.length > 1) {
      const next = points.filter((_,i)=>i!==selectedPoint);
      setPoints(next);
      setSelectedPoint(Math.max(0, Math.min(selectedPoint, next.length-1)));
    }
  };
  const updateSelected = (patch) => {
    if (selectedPoint == null || !points[selectedPoint]) return;
    const np = points.slice();
    np[selectedPoint] = { ...np[selectedPoint], ...patch };
    setPoints(np);
  };

  return (
    <div>
      <div className="row">
        <button className={'pill accent' + (enabled?' on':'')} onClick={()=>setEnabled(!enabled)}>{enabled?'● ON':'○ OFF'}</button>
        <button className="pill" onClick={addPoint}>+ POINT</button>
        <button className="pill" onClick={removePoint}>− POINT</button>
        <button className="pill accent" onClick={onDice}>🎲 DICE</button>
        <button className="pill" onClick={()=>{ setPoints([{ x:0.5, y:0.5, z:0.54, flavor:'Center Shimmer', mix:0.36, shimmer:0.38, space:0.74, delay:0.32, feedback:0.18, glitter:0.28, air:0.64, isCenter:true }]); setSelectedPoint(0); }}>SOFT RESET</button>
      </div>
      <div className="threed-mode-row">
        {['stage','head','grid'].map(m => (
          <button key={m} className={'pill' + (mode===m?' on':'')} onClick={()=>setMode(m)}>{m.toUpperCase()}</button>
        ))}
      </div>
      <div className="threed-canvas-wrap" ref={wrapRef}>
        <canvas ref={canvasRef}></canvas>
        {points.map((p, i) => (
          <div key={i}
               className={'threed-orb' + (i===selectedPoint?' selected':'') + (p.isCenter?' center':'')}
               style={{left: (p.x*100)+'%', top: (p.y*100)+'%'}}
               onMouseDown={dragPoint(i)} onTouchStart={dragPoint(i)}
               title={`${p.flavor} • X ${(p.x*100|0)} Y ${(p.y*100|0)} Depth ${((p.z ?? .5)*100|0)}`}>

            <span className="threed-orb-label">{i+1} {p.flavor}</span>
          </div>
        ))}
      </div>
      {selectedPoint != null && points[selectedPoint] && (
        <div className="threed-panel">
          <div className="title-sm">POINT {selectedPoint+1}: {points[selectedPoint].flavor}</div>
          <div className="row">
            <label>Flavor</label>
            <select className="mini-input" value={points[selectedPoint].flavor} onChange={e=>updateSelected({flavor:e.target.value})}>

            </select>
            <span className="small" style={{color:'var(--neon-dim)'}}>X {(points[selectedPoint].x*100|0)} • Y {(points[selectedPoint].y*100|0)}</span>
          </div>
          {[['mix','Mix'],['z','Depth'],['shimmer','Shimmer'],['space','Space'],['delay','Echo Time'],['feedback','Feedback'],['glitter','Glitter'],['air','Air']].map(([key,label]) => (
            <div className="row" key={key}>
              <label>{label}</label>
              <input type="range" min="0" max="1" step="0.01" value={points[selectedPoint][key] ?? .5}
                onChange={e=>updateSelected({[key]:+e.target.value})} />
              <span>{(((points[selectedPoint][key] ?? .5)*100)|0)}%</span>
            </div>
          ))}
          <div className="small" style={{color:'var(--neon-dim)'}}>Each orb is now gain-staged softly. Drag left/right for stereo position, up/down for brightness/space feel, and shape mix, shimmer, feedback, glitter, air, and depth without harsh clipping.</div>
        </div>
      )}
    </div>
  );
};



/* ============================================================
   MEDIA → SOUNDSCAPE WINDOW
   ============================================================ */
const MEDIA_SCALES = {
  Ionian:[0,2,4,5,7,9,11,12,14],
  Dorian:[0,2,3,5,7,9,10,12,14],
  Lydian:[0,2,4,6,7,9,11,12,14],
  Minor:[0,2,3,5,7,8,10,12,15],
  Pentatonic:[0,2,4,7,9,12,14,16],
  WholeTone:[0,2,4,6,8,10,12,14],
  Dream:[0,2,5,7,9,12,14,17]
};
const wait = (ms) => new Promise(res => setTimeout(res, ms));
const mediaClamp = (v, lo=0, hi=1) => Math.max(lo, Math.min(hi, Number.isFinite(+v) ? +v : lo));
const rgbToHsvMedia = (r,g,b) => {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if (d) {
    if (max===r) h=((g-b)/d + (g<b?6:0))/6;
    else if (max===g) h=((b-r)/d + 2)/6;
    else h=((r-g)/d + 4)/6;
  }
  return {h, s:max ? d/max : 0, v:max};
};
const drawMediaFrameToData = (source, tiny, tinyCtx) => {
  tinyCtx.clearRect(0,0,tiny.width,tiny.height);
  tinyCtx.drawImage(source, 0, 0, tiny.width, tiny.height);
  return tinyCtx.getImageData(0,0,tiny.width,tiny.height).data;
};
const readMediaByteSignature = async (file) => {
  const max = Math.min(file.size || 0, 524288);
  const buf = await file.slice(0, max).arrayBuffer();
  const arr = new Uint8Array(buf);
  let sum=0, sum2=0, hash=2166136261, stride=Math.max(1, Math.floor(arr.length / 12000));
  const sequence = [];
  for (let i=0; i<arr.length; i+=stride) {
    const v = arr[i]; sum += v; sum2 += v*v;
    hash ^= v; hash = Math.imul(hash, 16777619) >>> 0;
    if (sequence.length < 64) sequence.push((v + i) % 16);
  }
  const n = Math.max(1, Math.ceil(arr.length / stride));
  const mean = sum / n / 255;
  const variance = Math.max(0, (sum2/n) - Math.pow(sum/n,2)) / (255*255);
  return { mean, variance, hash, seed:hash, sequence, bytesRead:arr.length };
};
const analyzeMediaFrames = (frameData, byteSig) => {
  if (!frameData.length) return null;
  const w = 96, h = 72;
  let bright=0, bright2=0, sat=0, hueX=0, hueY=0, edge=0, texture=0, warm=0, sym=0, dark=0, light=0;
  let pixels = 0;
  const palette = new Map();
  const swatchTotals = new Map();
  let motion = 0, motionCount = 0;
  frameData.forEach((data, fi) => {
    const prev = fi > 0 ? frameData[fi-1] : null;
    for (let y=0; y<h; y++) {
      for (let x=0; x<w; x++) {
        const idx = (y*w+x)*4;
        const r=data[idx], g=data[idx+1], b=data[idx+2];
        const lum = (0.2126*r + 0.7152*g + 0.0722*b)/255;
        const hsv = rgbToHsvMedia(r,g,b);
        bright += lum; bright2 += lum*lum; sat += hsv.s;
        hueX += Math.cos(hsv.h * Math.PI * 2) * hsv.s;
        hueY += Math.sin(hsv.h * Math.PI * 2) * hsv.s;
        warm += mediaClamp((r - b + 255) / 510);
        if (lum < .18) dark++; if (lum > .82) light++;
        if (x > 0) {
          const li = idx-4;
          const l2 = (0.2126*data[li] + 0.7152*data[li+1] + 0.0722*data[li+2])/255;
          const d = Math.abs(lum-l2); edge += d > .13 ? 1 : 0; texture += d;
        }
        if (y > 0) {
          const ui = idx-w*4;
          const u2 = (0.2126*data[ui] + 0.7152*data[ui+1] + 0.0722*data[ui+2])/255;
          const d = Math.abs(lum-u2); edge += d > .13 ? 1 : 0; texture += d;
        }
        if (x < w/2) {
          const mi = (y*w + (w-1-x))*4;
          const ml = (0.2126*data[mi] + 0.7152*data[mi+1] + 0.0722*data[mi+2])/255;
          sym += 1 - Math.abs(lum - ml);
        }
        if (prev) {
          const pr=prev[idx], pg=prev[idx+1], pb=prev[idx+2];
          motion += (Math.abs(r-pr)+Math.abs(g-pg)+Math.abs(b-pb))/(255*3);
          motionCount++;
        }
        const key = `${r>>5}${g>>5}${b>>5}`;
        palette.set(key, (palette.get(key)||0)+1);
        const sw = `${(r>>4)<<4},${(g>>4)<<4},${(b>>4)<<4}`;
        const t = swatchTotals.get(sw) || {n:0,r:0,g:0,b:0};
        t.n++; t.r+=r; t.g+=g; t.b+=b; swatchTotals.set(sw,t);
        pixels++;
      }
    }
  });
  const denom = Math.max(1, pixels);
  const brightness = bright/denom;
  const contrast = Math.sqrt(Math.max(0, bright2/denom - brightness*brightness)) * 2.4;
  let hue = Math.atan2(hueY, hueX)/(Math.PI*2); if (hue < 0) hue += 1;
  const paletteSpread = mediaClamp(palette.size / 420);
  const symmetry = mediaClamp(sym / Math.max(1, frameData.length*h*w/2));
  const colorRows = Array.from(swatchTotals.values()).sort((a,b)=>b.n-a.n).slice(0,8).map(t => ({
    hex:'#' + [t.r/t.n,t.g/t.n,t.b/t.n].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''),
    weight:t.n/denom
  }));
  const features = {
    brightness: mediaClamp(brightness),
    contrast: mediaClamp(contrast),
    saturation: mediaClamp(sat/denom),
    hue: mediaClamp(hue),
    edge: mediaClamp(edge / Math.max(1, denom*2)),
    texture: mediaClamp(texture / Math.max(1, denom*2) * 3.3),
    symmetry,
    motion: mediaClamp((motion / Math.max(1, motionCount)) * 2.8),
    warmth: mediaClamp(warm/denom),
    paletteSpread,
    darkRatio: dark/denom,
    lightRatio: light/denom,
    byteMean: byteSig.mean || 0,
    byteVariance: mediaClamp((byteSig.variance || 0) * 6)
  };
  features.complexity = mediaClamp((features.edge*.28)+(features.texture*.22)+(features.contrast*.18)+(features.paletteSpread*.18)+(features.motion*.14));
  return { features, palette: colorRows, bytes: byteSig };
};
const buildMediaSignature = (analysis, file) => {
  const f = analysis.features;
  const rootPc = Math.round((f.hue * 11 + f.byteMean * 7 + f.warmth * 3)) % 12;
  let scaleName = 'Dream';
  if (f.saturation > .68 && f.brightness > .55) scaleName = 'Lydian';
  else if (f.brightness < .34) scaleName = 'Minor';
  else if (f.motion > .42) scaleName = 'Dorian';
  else if (f.paletteSpread > .62) scaleName = 'WholeTone';
  else if (f.contrast < .22 && f.symmetry > .58) scaleName = 'Pentatonic';
  else if (f.warmth > .58) scaleName = 'Ionian';
  const scale = MEDIA_SCALES[scaleName] || MEDIA_SCALES.Dream;
  const baseMidi = 36 + rootPc + (f.brightness > .62 ? 12 : 0);
  const notes = scale.map(iv => baseMidi + 12 + iv).filter(n=>n>=36 && n<=90);
  const chord = [baseMidi, baseMidi + scale[2], baseMidi + scale[4], baseMidi + scale[6] || baseMidi+14].filter(n=>n>=24 && n<=84);
  const tempo = Math.round(34 + f.motion*38 + f.complexity*32 + f.byteVariance*18);
  const seqBase = analysis.bytes.sequence && analysis.bytes.sequence.length ? analysis.bytes.sequence : [0,2,4,1,5,3,6,2];
  const sequence = seqBase.map((v,i)=>(v + i + Math.round(f.hue*12)) % notes.length).slice(0,48);
  return {
    name:file?.name || 'Media Soundscape',
    rootName: NOTE_NAMES[rootPc], rootMidi:baseMidi+12, scaleName, notes, chord, tempo, sequence,
    seed: analysis.bytes.seed || 1, palette:analysis.palette, features:f,
    description: `${NOTE_NAMES[rootPc]} ${scaleName} • ${tempo} BPM • ${file?.type || 'media'} • ${(file?.size ? (file.size/1024/1024).toFixed(2) : '0.00')} MB`
  };
};
const MediaMeter = ({ label, value }) => (
  <div className="media-meter">
    <div className="media-meter-label"><span>{label}</span><span>{Math.round((value||0)*100)}%</span></div>
    <div className="media-meter-track"><div className="media-meter-fill" style={{width: `${Math.round((value||0)*100)}%`}}></div></div>
  </div>
);
const MediaSoundscapeWindow = () => {
  const [fileInfo, setFileInfo] = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [signature, setSignature] = useState(null);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('Upload a photo, video, or GIF to build a data-driven soundscape.');
  const [playing, setPlaying] = useState(false);
  const [settings, setSettings] = useState({ presence:.52, shimmer:.42, space:.68, texture:.46, motion:.34, softness:.78, tempo:54 });

  useEffect(() => () => { if (previewUrl) URL.revokeObjectURL(previewUrl); AE.stopMediaSoundscape(); }, [previewUrl]);
  useEffect(() => { if (playing) AE.updateMediaSoundscape(settings); }, [settings, playing]);

  const captureImageFrames = async (url) => {
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    await new Promise((resolve, reject) => { img.onload=resolve; img.onerror=reject; });
    const tiny = document.createElement('canvas'); tiny.width = 96; tiny.height = 72;
    const tinyCtx = tiny.getContext('2d', { willReadFrequently:true });
    const frames = [];
    for (let i=0; i<8; i++) {
      frames.push(new Uint8ClampedArray(drawMediaFrameToData(img, tiny, tinyCtx)));
      await wait(115);
    }
    return frames;
  };
  const seekVideo = (video, time) => new Promise(resolve => {
    const done = () => { video.removeEventListener('seeked', done); resolve(); };
    video.addEventListener('seeked', done, { once:true });
    try { video.currentTime = time; } catch(e) { resolve(); }
  });
  const captureVideoFrames = async (url) => {
    const video = document.createElement('video');
    video.src = url; video.muted = true; video.playsInline = true; video.preload = 'auto'; video.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => { video.onloadedmetadata=resolve; video.onerror=reject; });
    const tiny = document.createElement('canvas'); tiny.width = 96; tiny.height = 72;
    const tinyCtx = tiny.getContext('2d', { willReadFrequently:true });
    const frames = [];
    const dur = Number.isFinite(video.duration) && video.duration > .2 ? video.duration : 3;
    const count = Math.min(14, Math.max(6, Math.round(dur * 2)));
    for (let i=0; i<count; i++) {
      await seekVideo(video, Math.min(dur - .05, (dur * (i+.5)) / count));
      frames.push(new Uint8ClampedArray(drawMediaFrameToData(video, tiny, tinyCtx)));
    }
    return frames;
  };
  const analyzeFile = async (file, url) => {
    setBusy(true); setStatus('Reading pixels, palette, motion, texture, and file fingerprint…');
    try {
      const byteSig = await readMediaByteSignature(file);
      const frames = file.type.startsWith('video/') ? await captureVideoFrames(url) : await captureImageFrames(url);
      const result = analyzeMediaFrames(frames, byteSig);
      const sig = buildMediaSignature(result, file);
      setAnalysis(result); setSignature(sig);
      setSettings(prev => ({
        ...prev,
        shimmer: mediaClamp(.20 + result.features.saturation*.36 + result.features.lightRatio*.12),
        space: mediaClamp(.42 + result.features.symmetry*.34 + (1-result.features.contrast)*.12),
        texture: mediaClamp(.24 + result.features.texture*.42 + result.features.edge*.18),
        motion: mediaClamp(.20 + result.features.motion*.52 + result.features.byteVariance*.12),
        softness: mediaClamp(.66 + result.features.symmetry*.18 - result.features.edge*.08),
        tempo: sig.tempo
      }));
      setStatus(`Built soundscape signature: ${sig.description}`);
      return sig;
    } catch(err) {
      console.error(err);
      setStatus('Could not analyze that media file. Try another image/video/GIF format.');
    } finally { setBusy(false); }
  };
  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    AE.stopMediaSoundscape(); setPlaying(false);
    const url = URL.createObjectURL(file);
    setPreviewUrl(url); setFileInfo({ name:file.name, type:file.type || 'unknown', size:file.size });
    setAnalysis(null); setSignature(null);
    await analyzeFile(file, url);
  };
  const start = async () => {
    if (!signature) { setStatus('Analyze a media file first.'); return; }
    await Tone.start(); AE.init();
    AE.startMediaSoundscape(signature, settings);
    setPlaying(true); setStatus('Soundscape playing from analyzed media data.');
  };
  const stop = () => { AE.stopMediaSoundscape(); setPlaying(false); setStatus('Soundscape stopped.'); };
  const change = (key, value) => setSettings(prev => ({...prev, [key]: key==='tempo' ? Math.round(value) : value }));
  const isVideo = fileInfo && String(fileInfo.type).startsWith('video/');

  return (
    <div className="media-soundscape">
      <div className="media-upload-zone">
        <input type="file" accept="image/*,video/*,.gif" onChange={onFile} />
        <button className="pill" onClick={()=> previewUrl && fileInfo && setStatus('Re-select the same file to refresh the analysis frames.')}>MEDIA DATA</button>
        <span className="media-status">{busy ? 'ANALYZING…' : status}</span>
      </div>
      <div className="media-preview">
        {!previewUrl && <div className="media-preview-empty">PHOTO / VIDEO / GIF PREVIEW</div>}
        {previewUrl && isVideo && <video src={previewUrl} controls muted loop playsInline />}
        {previewUrl && !isVideo && <img src={previewUrl} alt="Uploaded media preview" />}
      </div>
      <div className="row">
        <button className={'pill accent' + (playing?' on':'')} disabled={!signature || busy} onClick={playing ? stop : start}>{playing ? '■ STOP SOUNDSCAPE' : '▶ PLAY SOUNDSCAPE'}</button>
        <button className="pill" disabled={!signature || busy} onClick={()=>signature && AE.startMediaSoundscape(signature, settings)}>RENDER AGAIN</button>
        {signature && <span className="small" style={{color:'var(--neon)'}}>{signature.rootName} {signature.scaleName} / {settings.tempo} BPM</span>}
      </div>
      {analysis && signature && (
        <Fragment>
          <div className="media-signature">
            <div className="title-sm">DATA SIGNATURE</div>
            <div>{signature.description}</div>
            <div className="media-palette">{signature.palette.map((p,i)=><span key={i} className="media-swatch" style={{background:p.hex}} title={`${p.hex} ${(p.weight*100).toFixed(1)}%`}></span>)}</div>
          </div>
          <div className="media-analysis-grid">
            <MediaMeter label="Brightness" value={analysis.features.brightness}/>
            <MediaMeter label="Contrast" value={analysis.features.contrast}/>
            <MediaMeter label="Saturation" value={analysis.features.saturation}/>
            <MediaMeter label="Hue Field" value={analysis.features.hue}/>
            <MediaMeter label="Edges" value={analysis.features.edge}/>
            <MediaMeter label="Texture" value={analysis.features.texture}/>
            <MediaMeter label="Symmetry" value={analysis.features.symmetry}/>
            <MediaMeter label="Motion" value={analysis.features.motion}/>
            <MediaMeter label="Palette Spread" value={analysis.features.paletteSpread}/>
            <MediaMeter label="File Fingerprint" value={analysis.features.byteVariance}/>
          </div>
          <div className="divider"></div>
          <div className="title-sm">SOUNDSCAPE CONTROLS</div>
          {[
            ['presence','Presence'],['space','Space'],['shimmer','Shimmer'],['texture','Texture'],['motion','Motion'],['softness','Softness']
          ].map(([key,label]) => (
            <div className="row" key={key}>
              <label>{label}</label>
              <input type="range" min="0" max="1" step="0.01" value={settings[key]} onChange={e=>change(key,+e.target.value)} />
              <span>{Math.round(settings[key]*100)}%</span>
            </div>
          ))}
          <div className="row">
            <label>Tempo</label>
            <input type="range" min="24" max="132" step="1" value={settings.tempo} onChange={e=>change('tempo',+e.target.value)} />
            <span>{settings.tempo} BPM</span>
          </div>
          <div className="media-map-list">
            <div>Brightness → octave, filter openness, note glow.</div>
            <div>Hue + palette → root note, scale color, chord extension.</div>
            <div>Edges/texture → sparkle density and FM detail.</div>
            <div>Symmetry → reverb length, drone stability, softness.</div>
            <div>Video/GIF motion → pulse rate and moving shimmer response.</div>
            <div>File fingerprint → deterministic note order, so two similar photos still differ.</div>
          </div>
        </Fragment>
      )}
    </div>
  );
};

    c.width = 1000; c.height = 800;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#00ffd0';
    ctx.font = 'bold 32px monospace';
    ctx.shadowColor = '#00ffd0'; ctx.shadowBlur = 12;
    ctx.fillText('HOLD IT DOWN — SHORTCUTS', 40, 60);
    ctx.shadowBlur = 0;
    ctx.font = '16px monospace';
    let y = 120;
    const entries = Object.entries(SHORTCUTS);
    const palette = ['#00ffd0','#ff4dd2','#ffd000','#00d0ff','#a0ff00','#ff8000'];
    entries.forEach(([k,v], i) => {
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(40, y-18, 120, 24);
      ctx.fillStyle = '#000';
      ctx.fillText(k, 50, y);
      ctx.fillStyle = '#eaeaea';

    ctx.fillStyle = '#00ffd0'; ctx.font = '14px monospace';
    ctx.fillText('designed by Mario Garcia', 40, 790);
    c.toBlob(blob => {

};

    whiteKey:'#f4f9f6', blackKey:'#0a1413', bright:1, contrast:1
  });

  // -- play/stop transport
  const [playing, setPlaying] = useState(false);

  // ===== current patch object =====
  const currentPatch = useMemo(() => {
    const base = BANKS[bankId].patches[patchIdx];
    // apply sound design overrides
    return {
      ...base,
      amp: [sd.attack, sd.decay, sd.sustain, sd.release],
      filt: sd.cutoff,
      q: sd.resonance,
    };
  }, [bankId, patchIdx, sd]);

  // ===== Apply theme =====
  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--bg', theme.bg);
    r.setProperty('--neon', theme.neon);
    r.setProperty('--neon-dim', theme.neon);
    r.setProperty('--accent', theme.accent);
    r.setProperty('--text', theme.text);
    r.setProperty('--white-key', theme.whiteKey);
    r.setProperty('--black-key', theme.blackKey);
    r.setProperty('--ui-bright', theme.bright);
    r.setProperty('--ui-contrast', theme.contrast);
  }, [theme]);

  // ===== Custom keyboard mapper persistence + assignment capture =====
  useEffect(() => {
    try { localStorage.setItem('holdItDownCustomKeyMappings', JSON.stringify(customMappings)); } catch(e){}
  }, [customMappings]);

  useEffect(() => {
    refreshKeymapTargets();
  }, [windows, topbarOpen, topbarHeight, hideKeys, pads, threedOn, threedPoints, modValue, pitchValue, fx, sd]);

  useEffect(() => {
    if (!keyMapperEditMode || !keyMapperSelected) {
      document.body.classList.remove('keymap-editing');
      return;
    }
    document.body.classList.add('keymap-editing');
    refreshKeymapTargets();
    let captured = false;
    const pick = (e) => {
      if (e.target.closest('.keymap-window-root')) return;
      const el = e.target.closest('[data-keymap-target="true"]');
      if (!el || el.closest('.keymap-window-root')) return;
      e.preventDefault(); e.stopPropagation();
      captured = true;
      const info = getKeymapTargetInfo(el);
      const mapping = {
        targetId: el.dataset.mapId,
        kind: info.kind,
        label: info.label,
        direction: keyMapperDirection,
        createdAt: Date.now()
      };
      setCustomMappings(m => ({ ...m, [keyMapperSelected]: mapping }));
      setKeyMapperEditMode(false);
    };
    const blockClick = (e) => { if (captured) { e.preventDefault(); e.stopPropagation(); captured = false; } };
    window.addEventListener('pointerdown', pick, true);
    window.addEventListener('click', blockClick, true);
    return () => {
      document.body.classList.remove('keymap-editing');
      window.removeEventListener('pointerdown', pick, true);
      window.removeEventListener('click', blockClick, true);
    };
  }, [keyMapperEditMode, keyMapperSelected, keyMapperDirection]);

  const executeCustomMapping = useCallback((event, phase='down') => {
    const code = keyEventCode(event);
    const mapping = customMappings[code];
    if (!mapping || keyMapperEditMode) return false;
    const isAdjust = ['range','knob','modslider','select'].includes(mapping.kind);
    if (event.repeat && !isAdjust) { event.preventDefault(); return true; }
    event.preventDefault();
    const handled = runMappedTarget(mapping, phase);
    return handled;
  }, [customMappings, keyMapperEditMode]);

  // ===== Apply FX =====
  useEffect(() => {
    if (audioReady) AE.setFX(fx);
  }, [fx, audioReady]);

  // ===== Apply master volume =====
  useEffect(() => {
    if (audioReady) AE.setMaster(masterVol);
  }, [masterVol, audioReady]);

  // ===== Apply pitch bend / mod =====
  useEffect(() => {
    if (!audioReady) return;
    const bendCents = pitchValue * bendRange * 100;
    AE.applyDetune(bendCents, glideMs / 1000); // cents, smoothed by Glide control
    AE.applySamplerPitch(bendCents, glideMs / 1000); // uploaded audio/video pads glide with pitch bend too
    // Mod effect modulates the shared FX layer, which sampler pads also feed through
    if (modEffect === 'Shimmer Reverb') AE.setFX({ ...fx, reverbWet: Math.max(fx.reverbWet, modValue*0.8) });
    if (modEffect === 'Tape Wow') AE.setFX({ ...fx, tremolo: Math.max(fx.tremolo, modValue*0.6) });
    if (modEffect === 'Filter Sweep') AE.setFX({ ...fx, filterCut: 600 + (1-modValue)*16000 });
    if (modEffect === 'Detune Choir') AE.setFX({ ...fx, chorus: Math.max(fx.chorus, modValue) });
    if (modEffect === 'Bit Crush') AE.setFX({ ...fx, drive: Math.max(fx.drive, modValue*0.8) });
    if (modEffect === 'Tremolo Cosmic') AE.setFX({ ...fx, tremolo: Math.max(fx.tremolo, modValue), phaser: Math.max(fx.phaser, modValue) });
    if (modEffect === 'Chorus Wide') AE.setFX({ ...fx, chorus: Math.max(fx.chorus, modValue*0.9) });
    if (modEffect === 'Auto Wah') AE.setFX({ ...fx, filterCut: 400 + modValue*4000, filterRes: 4 + modValue*8 });
  }, [pitchValue, bendRange, glideMs, modValue, modEffect, audioReady]);

  // ===== Apply 3D state =====
  useEffect(() => {
    if (!audioReady) return;
    AE.set3D(threedOn, threedPoints, threedSelected);
  }, [threedOn, threedPoints, threedSelected, audioReady]);

  // ===== Note handlers =====
  const noteOnRaw = useCallback((midi) => {
    if (!audioReady) return;
    const m = midi + octaveShift*12 + transposeShift;
    if (buildMode) {
      setBuildShape(s => { const ns = new Set(s); ns.has(m) ? ns.delete(m) : ns.add(m); return ns; });
      return;
    }
    if (voiceMode !== 'poly') {
      // mono / legato — kill others
      Object.keys(AE.voices).forEach(k => AE.noteOff(+k));
    }
    AE.noteOn(m, currentPatch);
    setActiveMidis(s => { const ns = new Set(s); ns.add(m); return ns; });
    // armed recording? we don't actually record samples here, but we add the note to current pad
    if (armed && pads[currentPadIdx]) {
      const np = pads.slice();
      np[currentPadIdx] = { ...np[currentPadIdx], type:'note', data: m, chord:null, name: midiToName(m), transpose: np[currentPadIdx]?.transpose || 0 };
      setPads(np);
    }
  }, [audioReady, octaveShift, transposeShift, voiceMode, currentPatch, buildMode, armed, pads, currentPadIdx]);

  const noteOffRaw = useCallback((midi) => {
    if (!audioReady) return;
    const m = midi + octaveShift*12 + transposeShift;
    if (buildMode) return;
    if (sustain || sustainHeld.has(m)) {
      setSustainHeld(s => { const ns = new Set(s); ns.add(m); return ns; });
      return;
    }
    AE.noteOff(m);
    setActiveMidis(s => { const ns = new Set(s); ns.delete(m); return ns; });
  }, [audioReady, octaveShift, transposeShift, buildMode, sustain, sustainHeld]);

  // sustain release
  useEffect(() => {
    if (!sustain) {
      sustainHeld.forEach(m => {
        AE.noteOff(m);
        setActiveMidis(s => { const ns = new Set(s); ns.delete(m); return ns; });
      });
      setSustainHeld(new Set());
    }
  }, [sustain]);

  // ===== Chord bank: light up notes =====
  const onSelectChord = useCallback((root, q) => {
    const formula = CHORD_FORMULAS[q];
    const rootMidi = 60 + ROOT_TO_PC[root];
    const midis = formula.map(i => rootMidi + i);
    setLitMidis(new Set(midis));
    // play preview
    midis.forEach(m => {
      AE.noteOn(m, currentPatch);
      setTimeout(()=>AE.noteOff(m), 800);
    });
    if (buildMode) {
      setBuildShape(s => { const ns = new Set(s); midis.forEach(m=>ns.add(m)); return ns; });
    }
  }, [currentPatch, buildMode]);

  // ===== Transpose: shift lit keys =====
  const transposeUp = () => {
    setTransposeShift(t => t+1);
    setLitMidis(s => new Set([...s].map(m => m+1)));
    setBuildShape(s => new Set([...s].map(m => m+1)));
  };
  const transposeDown = () => {
    setTransposeShift(t => t-1);
    setLitMidis(s => new Set([...s].map(m => m-1)));
    setBuildShape(s => new Set([...s].map(m => m-1)));
  };

  // ===== Build mode: play shape =====
  const playBuildShape = () => {
    if (buildShape.size === 0) return;
    buildShape.forEach(m => {
      AE.noteOn(m, currentPatch);
      setTimeout(()=>AE.noteOff(m), 1500);
    });
  };
  const stopAll = () => {
    AE.allNotesOff();
    setActiveMidis(new Set());
    setSustainHeld(new Set());
  };
  const clearShape = () => { setBuildShape(new Set()); setLitMidis(new Set()); };

  // ===== Pad triggers + smooth wireless keyboard sequencing =====
  const padNodeRefs = useRef({});
  const padReleaseMs = 140;
  const padOverlapMs = 55;

  const stopPadSmooth = useCallback((i, fadeSeconds=0.14) => {
    const ref = padNodeRefs.current[i];
    if (!ref) return;
    if (ref.type === 'audio') {
      try {
        if (ref.pitchRaf) cancelAnimationFrame(ref.pitchRaf);
        ref.gain.gain.cancelScheduledValues(Tone.now());
        ref.gain.gain.rampTo(0, fadeSeconds);
        setTimeout(() => {
          try { ref.player.stop(); ref.player.dispose(); ref.gain.dispose(); AE.disposePadFxChain(ref.chain); } catch(e){}
        }, Math.max(40, fadeSeconds*1000 + 30));
      } catch(e){}
      delete AE.padPlayers[i];
    } else if (Array.isArray(ref.notes)) {
      setTimeout(() => {
        ref.notes.forEach(m => AE.noteOff(m));
      }, Math.max(20, fadeSeconds*650));
      setTimeout(() => AE.disposePadFxChain(ref.chain), Math.max(900, fadeSeconds*1000 + 700));
    }
    delete padNodeRefs.current[i];
    setPlayingPads(s => { const ns = new Set(s); ns.delete(i); return ns; });
  }, []);

  const startPadSmooth = useCallback((i) => {
    const pad = pads[i];
    if (!pad || !pad.enabled) return false;
    const tr = pad.transpose || 0;
    setPlayingPads(s => { const ns = new Set(s); ns.add(i); return ns; });
    if (pad.type === 'audio' && pad.data) {
      stopPadSmooth(i, 0.05);
      const chain = AE.createPadFxChain(pad.fx);
      const gain = new Tone.Gain(0).connect(chain ? chain.input : AE.voicesInput());
      const player = new Tone.Player(pad.data).connect(gain);
      const baseRate = Math.pow(2, tr/12);
      player.playbackRate = baseRate * Math.pow(2, (AE.samplerPitchCents || 0) / 1200);
      player.start(Tone.now() + 0.005);
      gain.gain.rampTo(1, 0.11);
      const ref = { type:'audio', player, gain, chain, baseRate };
      padNodeRefs.current[i] = ref;
      AE.padPlayers[i] = ref;
      return true;
    }
    if (pad.type === 'note' && typeof pad.data === 'number') {
      const note = pad.data + tr;
      const chain = AE.createPadFxChain(pad.fx);
      AE.noteOn(note, currentPatch, chain ? chain.input : null);
      padNodeRefs.current[i] = { type:'note', notes:[note], chain };
      return true;
    }
    if (pad.type === 'chord' && Array.isArray(pad.chord)) {
      const notes = pad.chord.map(m => m + tr);
      const chain = AE.createPadFxChain(pad.fx);
      notes.forEach(m => AE.noteOn(m, currentPatch, chain ? chain.input : null));
      padNodeRefs.current[i] = { type:'chord', notes, chain };
      return true;
    }
    setPlayingPads(s => { const ns = new Set(s); ns.delete(i); return ns; });
    return false;
  }, [pads, currentPatch, stopPadSmooth]);

  useEffect(() => {
    if (!audioReady) return;
    Object.entries(padNodeRefs.current).forEach(([idx, ref]) => {
      const pad = pads[Number(idx)];
      if (ref && ref.chain && pad) AE.updatePadFxChain(ref.chain, pad.fx);
      if (ref && ref.type === 'audio' && pad) {
        const nextBaseRate = Math.pow(2, ((pad.transpose || 0) / 12));
        ref.baseRate = nextBaseRate;
        AE.applySamplerPitch(AE.samplerPitchCents || 0, 0.03);
      }
    });
  }, [pads, audioReady]);

  const getSequencedPadIndex = useCallback((direction=1, baseIdx=currentPadIdx) => {
    if (!pads.length) return 0;
    const usable = pads.map((p,i)=>({p,i})).filter(({p}) => p && p.enabled && p.type !== 'empty');
    const pool = usable.length ? usable.map(x=>x.i) : pads.map((_,i)=>i);
    const currentPos = Math.max(0, pool.indexOf(baseIdx));
    if (cycleMode === 'pingpong') {
      const dir = direction || cycleDir.current || 1;
      let nextPos = currentPos + dir;
      if (nextPos >= pool.length) { nextPos = Math.max(0, pool.length-2); cycleDir.current = -1; }
      else if (nextPos < 0) { nextPos = Math.min(pool.length-1, 1); cycleDir.current = 1; }
      else { cycleDir.current = dir; }
      return pool[nextPos] ?? currentPadIdx;
    }
    const nextPos = (currentPos + direction + pool.length) % pool.length;
    return pool[nextPos] ?? currentPadIdx;
  }, [pads, currentPadIdx, cycleMode]);

  const transitionToPad = useCallback((nextIdx) => {
    if (nextIdx == null || nextIdx < 0 || nextIdx >= pads.length) return;
    const previous = Object.keys(padNodeRefs.current).map(Number).filter(i => i !== nextIdx);
    setCurrentPadIdx(nextIdx);
    const started = startPadSmooth(nextIdx);
    if (started) {
      setTimeout(() => previous.forEach(i => stopPadSmooth(i, padReleaseMs/1000)), padOverlapMs);
    }
  }, [pads.length, startPadSmooth, stopPadSmooth]);

  const sequencePad = useCallback((direction=1) => {
    const nextIdx = getSequencedPadIndex(direction);
    transitionToPad(nextIdx);
  }, [getSequencedPadIndex, transitionToPad]);

  const triggerPad = useCallback((i, on) => {
    const pad = pads[i];
    if (!pad || !pad.enabled) return;
    const mode = PAD_PLAY_MODES[padPlayMode] ? padPlayMode : 'stack';

    if (mode === 'toggle') {
      if (!on) return;
      setCurrentPadIdx(i);
      if (padNodeRefs.current[i]) {
        stopPadSmooth(i, padReleaseMs/1000);
      } else {
        startPadSmooth(i);
      }
      return;
    }

    if (mode === 'step') {
      if (!on) return;
      setCurrentPadIdx(i);
      const previous = Object.keys(padNodeRefs.current).map(Number).filter(idx => idx !== i);
      const started = startPadSmooth(i);
      if (started) {
        setTimeout(() => previous.forEach(idx => stopPadSmooth(idx, padReleaseMs/1000)), padOverlapMs);
      }
      const ni = getSequencedPadIndex(1, i);
      setCurrentPadIdx(ni);
      return;
    }

    // STACK mode: every pad can be layered. Sampler Sustain controls release behavior.
    if (on) {
      setCurrentPadIdx(i);
      startPadSmooth(i);
      if (cycleEnabled) {
        const ni = getSequencedPadIndex(1, i);
        setCurrentPadIdx(ni);
      }
    } else if (!sustainHold) {
      stopPadSmooth(i, padReleaseMs/1000);
    }
  }, [pads, padPlayMode, cycleEnabled, sustainHold, startPadSmooth, stopPadSmooth, getSequencedPadIndex]);

  // ===== Load chord into pad =====
  const loadChordToPad = useCallback((idx) => {
    const chord = [...buildShape];
    if (!chord.length) {
      // fall back to lit
      [...litMidis].forEach(m => chord.push(m));
    }
    if (!chord.length) return;
    const np = pads.slice();
    if (idx >= np.length) {
      np.push({ name: 'Chord '+(chord.length), enabled:true, type:'chord', data:null, chord, transpose:0, fx: withDefaultPadFx() });
    } else {
      np[idx] = { ...np[idx], type:'chord', data:null, chord, name:'Chord '+(chord.length), transpose: np[idx]?.transpose || 0, fx: withDefaultPadFx(np[idx]?.fx) };
    }
    setPads(np);
  }, [buildShape, litMidis, pads]);

  // ===== 3D dice randomize =====
  const dice3D = () => {
    const flavors = ['Shimmer','Aurora','Cosmic','Halo','Glitter','Sub Sky','Dream Echo','Vapor','Crystal','Phantom','Air Bell','Tape Choir'];
    const preset = {
      Shimmer:{shimmer:.46,space:.68,delay:.30,feedback:.18,glitter:.34,air:.66,mix:.42,z:.52}, Aurora:{shimmer:.34,space:.82,delay:.38,feedback:.22,glitter:.24,air:.58,mix:.38,z:.68}, Cosmic:{shimmer:.42,space:.78,delay:.48,feedback:.25,glitter:.30,air:.55,mix:.40,z:.74}, Halo:{shimmer:.26,space:.72,delay:.22,feedback:.14,glitter:.16,air:.74,mix:.32,z:.46}, Glitter:{shimmer:.48,space:.56,delay:.18,feedback:.15,glitter:.52,air:.80,mix:.34,z:.38}, 'Sub Sky':{shimmer:.12,space:.80,delay:.45,feedback:.24,glitter:.10,air:.34,mix:.36,z:.86}, 'Dream Echo':{shimmer:.32,space:.74,delay:.58,feedback:.27,glitter:.22,air:.54,mix:.38,z:.62}, Vapor:{shimmer:.28,space:.86,delay:.36,feedback:.20,glitter:.24,air:.70,mix:.34,z:.64}, Crystal:{shimmer:.52,space:.58,delay:.22,feedback:.16,glitter:.46,air:.84,mix:.36,z:.42}, Phantom:{shimmer:.22,space:.84,delay:.50,feedback:.25,glitter:.14,air:.48,mix:.32,z:.78}, 'Air Bell':{shimmer:.55,space:.55,delay:.16,feedback:.12,glitter:.42,air:.88,mix:.32,z:.34}, 'Tape Choir':{shimmer:.24,space:.70,delay:.42,feedback:.23,glitter:.12,air:.44,mix:.34,z:.56}
    };
    const n = 3 + Math.floor(Math.random()*4);
    const pts = Array.from({length:n}).map((_,i)=>{
      const flavor = flavors[Math.floor(Math.random()*flavors.length)];
      return { x:0.1+Math.random()*0.8, y:0.1+Math.random()*0.8, flavor, isCenter:i===0, ...preset[flavor] };
    });
    setThreedPoints(pts);
    setThreedSelected(0);
  };

  // ===== Save / Open project =====
  const saveProject = () => {
    const data = {
      version: 1,
      bankId, patchIdx, voiceMode,
      keysHeight, startMidi, numKeys, hideKeys, scrollEnabled, chromatic,
      octaveShift, transposeShift,
      masterVol, fx, sd,
      pads: pads.map(p => ({ ...p, data: p.type==='audio' ? null : p.data })), // can't serialize audio buffers
      bendRange, glideMs, modEffect, modValue, padPlayMode,
      threedOn, threedMode, threedPoints,
      customMappings,
      theme,
      buildShape: [...buildShape],
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hold-it-down-project.hid.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  const openProject = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,.hid,application/json';
    inp.onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        try {
          const d = JSON.parse(ev.target.result);
          d.bankId && setBankId(d.bankId);
          typeof d.patchIdx === 'number' && setPatchIdx(d.patchIdx);
          d.voiceMode && setVoiceMode(d.voiceMode);
          typeof d.keysHeight === 'number' && setKeysHeight(d.keysHeight);
          typeof d.startMidi === 'number' && setStartMidi(d.startMidi);
          typeof d.numKeys === 'number' && setNumKeys(d.numKeys);
          typeof d.hideKeys === 'boolean' && setHideKeys(d.hideKeys);
          typeof d.scrollEnabled === 'boolean' && setScrollEnabled(d.scrollEnabled);
          typeof d.chromatic === 'boolean' && setChromatic(d.chromatic);
          typeof d.octaveShift === 'number' && setOctaveShift(d.octaveShift);
          typeof d.transposeShift === 'number' && setTransposeShift(d.transposeShift);
          typeof d.masterVol === 'number' && setMasterVol(d.masterVol);
          d.fx && setFx(d.fx);
          d.sd && setSd(d.sd);
          Array.isArray(d.pads) && setPads(d.pads);
          typeof d.bendRange === 'number' && setBendRange(d.bendRange);
          typeof d.glideMs === 'number' && setGlideMs(d.glideMs);
          d.modEffect && setModEffect(d.modEffect);
          typeof d.modValue === 'number' && setModValue(d.modValue);
          d.padPlayMode && setPadPlayMode(d.padPlayMode);
          typeof d.threedOn === 'boolean' && setThreedOn(d.threedOn);
          d.threedMode && setThreedMode(d.threedMode);
          Array.isArray(d.threedPoints) && setThreedPoints(d.threedPoints);
          d.customMappings && setCustomMappings(d.customMappings);
          d.theme && setTheme(d.theme);
          Array.isArray(d.buildShape) && setBuildShape(new Set(d.buildShape));
        } catch(err) { alert('Failed to load: '+ err.message); }
      };
      r.readAsText(file);
    };
    inp.click();
  };

  // ===== Keyboard shortcuts =====
  useEffect(() => {
    const down = (e) => {
      if (isTypingTarget(e.target)) return;
      if (executeCustomMapping(e, 'down')) return;
      const k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === 's') { e.preventDefault(); saveProject(); return; }
      if ((e.metaKey || e.ctrlKey) && k === 'o') { e.preventDefault(); openProject(); return; }
      if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); AE.killAll(); setActiveMidis(new Set()); setSustainHeld(new Set()); return; }
      if (e.shiftKey && k === 'shift') return;
      if (k === 'shift') return;
      if (e.key === 'Shift') { setSustain(true); return; }
      if (k in KEY_MAP_NOTES && !e.repeat) { noteOnRaw(KEY_MAP_NOTES[k]); return; }
      if (k === 'z') { setOctaveShift(o => o-1); return; }
      if (k === 'x') { setOctaveShift(o => o+1); return; }
      if (k === ',') { transposeDown(); return; }
      if (k === '.') { transposeUp(); return; }
      if (e.key === 'ArrowUp')   { setPitchValue(1); return; }
      if (e.key === 'ArrowDown') { setPitchValue(-1); return; }
      if ((e.key === 'ArrowLeft' || k === '[') && !e.repeat) { e.preventDefault(); sequencePad(-1); return; }
      if ((e.key === 'ArrowRight' || k === ']') && !e.repeat) { e.preventDefault(); sequencePad(1); return; }
      if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); transitionToPad(currentPadIdx); return; }
      if (k === ' ') { e.preventDefault(); setPlaying(p=>!p); if (!playing) playBuildShape(); else stopAll(); return; }
      if (k === 'b') { setBuildMode(b=>!b); return; }
      if (k === 'c') { clearShape(); return; }
      if (k === 'm') { setModValue(v => Math.min(1, v+0.1)); return; }
      if (k === 'n') { setModValue(v => Math.max(0, v-0.1)); return; }
      if (k === 'h') { setHideKeys(h=>!h); return; }
      // pad triggers 1-5 row, q-t row
      const padKeys = ['1','2','3','4','5','q','w','e','r','t'];
      const pi = padKeys.indexOf(e.key);
      if (pi >= 0 && pi < pads.length && !e.repeat) { triggerPad(pi, true); }
    };
    const up = (e) => {
      if (isTypingTarget(e.target)) return;
      if (executeCustomMapping(e, 'up')) return;
      const k = e.key.toLowerCase();
      if (e.key === 'Shift') { setSustain(false); return; }
      if (k in KEY_MAP_NOTES) { noteOffRaw(KEY_MAP_NOTES[k]); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { setPitchValue(0); return; }
      const padKeys = ['1','2','3','4','5','q','w','e','r','t'];
      const pi = padKeys.indexOf(e.key);
      if (pi >= 0 && pi < pads.length) { triggerPad(pi, false); }
    };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, [noteOnRaw, noteOffRaw, transposeUp, transposeDown, playing, pads, triggerPad, sequencePad, transitionToPad, currentPadIdx, executeCustomMapping]);

  // ===== Topbar resize =====
  const onTopbarResize = (e) => {
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const startY = t.clientY, oh = topbarHeight;
    const move = (ev) => {
      ev.preventDefault && ev.preventDefault();
      const m = ev.touches ? ev.touches[0] : ev;
      const next = Math.max(0, Math.min(220, oh + (m.clientY - startY)));
      setTopbarHeight(next);
      setTopbarOpen(next > 18);
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', up);
  };

  // ===== Enter app =====
  const enter = async () => {
    await Tone.start();
    AE.init();
    setAudioReady(true);
    setView('app');
  };

  /* ===========================
     RENDER
     =========================== */
  if (view === 'home') return <Homepage onEnter={enter} />;

  const ws = (id) => windows[id] || { open:false, x:60, y:60, w:340, h:300, z:10 };
  const renderWindow = (id, title, content, defaults) => {
    const s = ws(id);
    if (!s.open) return null;
    return (
      <DraggableWindow
        title={title}
        x={s.x} y={s.y} w={s.w} h={s.h} z={s.z}
        onMove={(x,y) => setWindow(id, { x, y })}
        onResize={(w,h) => setWindow(id, { w, h })}
        onClose={() => closeWindow(id)}
        onFocus={() => focusWindow(id)}
      >
        {content}
      </DraggableWindow>
    );
  };

  return (
    <div className="app">
      {/* ============= TOPBAR ============= */}
      <div className="topbar" style={{maxHeight: topbarOpen ? topbarHeight : 0, padding: topbarOpen ? '6px 10px' : '0 10px'}}>
        <div className="top-group">
          <span className="top-label">VOL</span>
          <input type="range" min="0" max="1" step="0.01" value={masterVol} onChange={e=>setMasterVol(+e.target.value)} className="vol-slider" />
          <span className="small">{(masterVol*100|0)}</span>
        </div>
        <div className="top-group">
          <button className="top-btn danger" onClick={()=>{ AE.killAll(); AE.stopMediaSoundscape(); setActiveMidis(new Set()); setSustainHeld(new Set()); }}>⏻ KILL</button>
          <button className={'top-btn'+(sustain?' active':'')} onClick={()=>setSustain(!sustain)}>SUSTAIN</button>
        </div>
        <div className="top-group">
          <button className="top-btn" onClick={()=>{ setPlaying(true); playBuildShape(); }}>▶ PLAY</button>
          <button className="top-btn" onClick={()=>{ setPlaying(false); stopAll(); }}>■ STOP</button>
          <button className={'top-btn'+(buildMode?' active':'')} onClick={()=>setBuildMode(!buildMode)}>BUILD</button>
          <button className="top-btn" onClick={clearShape}>CLEAR</button>
        </div>
        <div className="top-group">
          <button className={'top-btn'+(chromatic?' active':'')} onClick={()=>setChromatic(!chromatic)}>CHROMATIC</button>
          <button className="top-btn" onClick={()=>setOctaveShift(o=>o-1)}>OCT −</button>
          <span className="small">{octaveShift>0?'+':''}{octaveShift}</span>
          <button className="top-btn" onClick={()=>setOctaveShift(o=>o+1)}>OCT +</button>
          <button className="top-btn" onClick={transposeDown}>TR −</button>
          <span className="small">{transposeShift>0?'+':''}{transposeShift}</span>
          <button className="top-btn" onClick={transposeUp}>TR +</button>
        </div>
        <div className="top-group">
          <button className={'top-btn'+(hideKeys?' active':'')} onClick={()=>setHideKeys(!hideKeys)}>HIDE KEYS</button>
          <button className={'top-btn'+(scrollEnabled?' active':'')} onClick={()=>setScrollEnabled(!scrollEnabled)}>SLIDE</button>
        </div>
        <div className="top-group">
          <button className="top-btn" onClick={()=>toggleWindow('color', {x:80,y:80,w:320,h:380})}>◆ COLOR</button>
          <button className="top-btn" onClick={saveProject}>💾 SAVE</button>
          <button className="top-btn" onClick={openProject}>📂 OPEN</button>
          <button className="top-btn" onClick={()=>toggleWindow('shortcuts', {x:100,y:100,w:520,h:420})}>⌨ KEYS</button>
          <button className="top-btn" onClick={()=>toggleWindow('keymap', {x:90,y:90,w:760,h:520})}>⌨ MAP</button>
          <button className="top-btn" onClick={()=>toggleWindow('media', {x:120,y:80,w:560,h:620})}>▧ MEDIA</button>
        </div>
        <div className="topbar-handle" onMouseDown={onTopbarResize} onTouchStart={onTopbarResize}></div>
      </div>
      <div style={{height:6, cursor:'ns-resize', background:'transparent', position:'relative'}} onMouseDown={onTopbarResize} onTouchStart={onTopbarResize}>
        <div style={{position:'absolute', left:'50%', transform:'translateX(-50%)', width:40, height:3, background:'var(--neon-dim)', top:1}}></div>
      </div>

      {/* ============= WORKSPACE ============= */}
      <div className="workspace">
        {renderWindow('banks', 'BANKS',
          <BanksWindow bankId={bankId} setBankId={setBankId} patchIdx={patchIdx} setPatchIdx={setPatchIdx} voiceMode={voiceMode} setVoiceMode={setVoiceMode} />,
          {x:20,y:20,w:340,h:380})}
        {renderWindow('fx', 'FX RACK',
          <FXRack
            fx={fx} setFx={setFx}
            padFx={pads[currentPadIdx]?.fx}
            setPadFx={(nextFx)=>setPads(prev=>prev.map((p,i)=>i===currentPadIdx ? { ...p, fx: withDefaultPadFx(nextFx) } : p))}
            currentPadIdx={currentPadIdx}
          />,
          {x:380,y:20,w:340,h:520})}
        {renderWindow('sd', 'SOUND DESIGN',
          <SoundDesign sd={sd} setSd={setSd} />,
          {x:740,y:20,w:340,h:380})}
        {renderWindow('chord', 'CHORD BANK',
          <ChordBankWindow onSelectChord={onSelectChord} rootFilter={rootFilter} setRootFilter={setRootFilter} />,
          {x:20,y:420,w:420,h:340})}
        {renderWindow('pads', 'PADS / SAMPLER',
          <PadsSamplerWindow
            pads={pads} setPads={setPads}
            currentPadIdx={currentPadIdx} setCurrentPadIdx={setCurrentPadIdx}
            cycleEnabled={cycleEnabled} setCycleEnabled={setCycleEnabled}
            cycleMode={cycleMode} setCycleMode={setCycleMode}
            armed={armed} setArmed={setArmed}
            sustainHold={sustainHold} setSustainHold={setSustainHold}
            padPlayMode={padPlayMode} setPadPlayMode={setPadPlayMode}
            onTriggerPad={triggerPad}
            onLoadChord={loadChordToPad}
            buildMode={buildMode} setBuildMode={setBuildMode}
            playingPads={playingPads}
          />,
          {x:460,y:420,w:480,h:400})}
        {renderWindow('mod', 'MOD / PITCH',
          <ModWheelWindow
            modValue={modValue} setModValue={setModValue}
            pitchValue={pitchValue} setPitchValue={setPitchValue}
            bendRange={bendRange} setBendRange={setBendRange}
            glideMs={glideMs} setGlideMs={setGlideMs}
            modEffect={modEffect} setModEffect={setModEffect}
          />,
          {x:980,y:20,w:420,h:380})}
        {renderWindow('3d', '✦ 3D SOUND',
          <ThreeDSoundWindow
            enabled={threedOn} setEnabled={setThreedOn}
            mode={threedMode} setMode={setThreedMode}
            points={threedPoints} setPoints={setThreedPoints}
            selectedPoint={threedSelected} setSelectedPoint={setThreedSelected}
            onDice={dice3D}
          />,
          {x:520,y:60,w:440,h:480})}
        {renderWindow('media', '▧ MEDIA SOUNDSCAPE',
          <MediaSoundscapeWindow />,
          {x:120,y:80,w:560,h:620})}
        {renderWindow('color', 'COLOR',
          <ColorCustomize theme={theme} setTheme={setTheme} />,
          {x:80,y:80,w:320,h:400})}
        {renderWindow('shortcuts', 'KEYBOARD SHORTCUTS',
          <ShortcutsWindow />,
          {x:120,y:80,w:560,h:440})}
        {renderWindow('keymap', '⌨ CUSTOM KEYBOARD MAP',
          <ShortcutMapperWindow
            mappings={customMappings} setMappings={setCustomMappings}
            selectedKey={keyMapperSelected} setSelectedKey={setKeyMapperSelected}
            editMode={keyMapperEditMode} setEditMode={setKeyMapperEditMode}
            assignDirection={keyMapperDirection} setAssignDirection={setKeyMapperDirection}
          />,
          {x:90,y:90,w:760,h:520})}
      </div>

      {/* ============= FEATURE BAR ============= */}
      <div className="feature-bar">
        <button className={'feature-btn'+(ws('banks').open?' open':'')} onClick={()=>toggleWindow('banks', {x:20,y:20,w:340,h:380})}>BANKS</button>
        <button className={'feature-btn'+(ws('fx').open?' open':'')} onClick={()=>toggleWindow('fx', {x:380,y:20,w:340,h:480})}>FX RACK</button>
        <button className={'feature-btn'+(ws('sd').open?' open':'')} onClick={()=>toggleWindow('sd', {x:740,y:20,w:340,h:380})}>SOUND DESIGN</button>
        <button className={'feature-btn'+(ws('chord').open?' open':'')} onClick={()=>toggleWindow('chord', {x:20,y:420,w:420,h:340})}>CHORD BANK</button>
        <button className={'feature-btn'+(ws('pads').open?' open':'')} onClick={()=>toggleWindow('pads', {x:460,y:420,w:480,h:400})}>PADS / SAMPLER</button>
        <button className={'feature-btn'+(ws('mod').open?' open':'')} onClick={()=>toggleWindow('mod', {x:980,y:20,w:420,h:380})}>MOD WHEEL</button>
        <button className={'feature-btn special'+(ws('3d').open?' open':'')} onClick={()=>toggleWindow('3d', {x:520,y:60,w:440,h:480})}>✦ 3D SOUND</button>
        <button className={'feature-btn special'+(ws('media').open?' open':'')} onClick={()=>toggleWindow('media', {x:120,y:80,w:560,h:620})}>▧ MEDIA SOUND</button>
        <button className={'feature-btn'+(ws('keymap').open?' open':'')} onClick={()=>toggleWindow('keymap', {x:90,y:90,w:760,h:520})}>⌨ MAP</button>
        <div style={{flex:1}}></div>
        <span className="small" style={{color:'var(--neon-dim)'}}>{BANKS[bankId].label} / {BANKS[bankId].patches[patchIdx].name}</span>
      </div>

      {/* ============= KEYBOARD ============= */}
      {!hideKeys && (
        <div className="keyboard-wrap">
          <div className="keyboard-control">
            <span className="small" style={{color:'var(--neon-dim)'}}>SIZE</span>
            <input type="range" min="0" max="280" step="2" value={keysHeight}
              onChange={e=>setKeysHeight(+e.target.value)} className="size-slider"/>
            <span className="small">RANGE</span>
            <input type="range" min="13" max="61" step="1" value={numKeys} onChange={e=>setNumKeys(+e.target.value)} style={{width:80}}/>
            <span className="small" style={{color:'var(--neon)'}}>{midiToName(startMidi)} – {midiToName(startMidi+numKeys-1)}</span>
          </div>
          {keysHeight > 16 && (
            <PianoKeys
              height={keysHeight}
              startMidi={startMidi}
              numKeys={numKeys}
              activeMidis={activeMidis}
              litMidis={litMidis}
              buildLitMidis={buildShape}
              chromatic={chromatic}
              onNoteOn={noteOnRaw}
              onNoteOff={noteOffRaw}
              scrollEnabled={scrollEnabled}
              onScroll={(steps) => setStartMidi(s => Math.max(12, Math.min(108-numKeys, s+steps)))}
            />
          )}
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
